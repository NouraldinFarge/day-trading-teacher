<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible chart-reading example</title><style>body{font-family:system-ui,sans-serif;max-width:70rem;margin:auto;padding:1.25rem;line-height:1.5}svg{max-width:100%;height:auto;border:1px solid currentColor}table{border-collapse:collapse;width:100%}th,td{border:1px solid;padding:.5rem;text-align:left}a:focus,button:focus{outline:3px solid currentColor;outline-offset:3px}.note{border:2px solid;padding:1rem}</style></head><body><main><h1>Accessible fictional price chart</h1><svg viewBox="0 0 800 400" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Five-minute fictional price sequence</title><desc id="chart-desc">Prices rise from 24.80 at 10:00 to 25.10 at 10:10, fall to 24.92 at 10:15, then recover to 25.05 at 10:20. A vertical decision line occurs at 10:10. Later prices must not be used as earlier evidence.</desc><line x1="70" y1="340" x2="750" y2="340" stroke="currentColor"/><line x1="70" y1="40" x2="70" y2="340" stroke="currentColor"/><polyline points="90,280 240,220 390,130 540,260 690,165" fill="none" stroke="currentColor" stroke-width="4"/><line x1="390" y1="50" x2="390" y2="340" stroke="currentColor" stroke-dasharray="8 6"/><text x="350" y="35">Decision point</text><text x="78" y="365">10:00</text><text x="225" y="365">10:05</text><text x="375" y="365">10:10</text><text x="525" y="365">10:15</text><text x="675" y="365">10:20</text></svg><h2>Data table</h2><table><thead><tr><th>Time</th><th>Fictional price</th><th>Decision-time status</th></tr></thead><tbody><tr><td>10:00</td><td>24.80</td><td>Known before decision</td></tr><tr><td>10:05</td><td>24.90</td><td>Known before decision</td></tr><tr><td>10:10</td><td>25.10</td><td>Decision point</td></tr><tr><td>10:15</td><td>24.92</td><td>Later event; unavailable at decision</td></tr><tr><td>10:20</td><td>25.05</td><td>Later event; unavailable at decision</td></tr></tbody></table></main></body></html>
