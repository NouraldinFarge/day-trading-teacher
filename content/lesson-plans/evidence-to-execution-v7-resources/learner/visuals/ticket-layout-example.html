<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible order-ticket example</title><style>body{font-family:system-ui,sans-serif;max-width:70rem;margin:auto;padding:1.25rem;line-height:1.5}svg{max-width:100%;height:auto;border:1px solid currentColor}table{border-collapse:collapse;width:100%}th,td{border:1px solid;padding:.5rem;text-align:left}a:focus,button:focus{outline:3px solid currentColor;outline-offset:3px}.note{border:2px solid;padding:1rem}</style></head><body><main><h1>Accessible order-ticket example</h1><p class="note">Training exhibit only. No order can be submitted from this page.</p><svg viewBox="0 0 760 330" role="img" aria-labelledby="ticket-title ticket-desc"><title id="ticket-title">Fictional order ticket</title><desc id="ticket-desc">Eight labeled fields: symbol SIMA, side buy, quantity 25, unit shares, order type limit, limit price 25.02, regular session, Day time in force.</desc><rect x="20" y="20" width="720" height="290" fill="none" stroke="currentColor"/><text x="40" y="55">Symbol: SIMA</text><text x="390" y="55">Side: Buy</text><text x="40" y="105">Quantity: 25</text><text x="390" y="105">Unit: shares</text><text x="40" y="155">Order type: Limit</text><text x="390" y="155">Limit: 25.02</text><text x="40" y="205">Session: Regular</text><text x="390" y="205">Time in force: Day</text><text x="40" y="270">Read back all eight fields before any simulated submit.</text></svg><h2>Text equivalent</h2><table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody><tr><td>Symbol</td><td>SIMA</td></tr><tr><td>Side</td><td>Buy</td></tr><tr><td>Quantity</td><td>25</td></tr><tr><td>Unit</td><td>Shares</td></tr><tr><td>Order type</td><td>Limit</td></tr><tr><td>Limit price</td><td>25.02</td></tr><tr><td>Session</td><td>Regular</td></tr><tr><td>Time in force</td><td>Day</td></tr></tbody></table></main></body></html>
