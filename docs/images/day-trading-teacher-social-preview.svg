<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Day-Trading Teacher</title>
  <desc id="description">A local-first Windows learning environment connecting lessons, historical replay, and evidence-based review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06140f"/>
      <stop offset="0.58" stop-color="#0a1d16"/>
      <stop offset="1" stop-color="#10281f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#5ed0a5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5ed0a5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="620" y="128" width="576" height="324" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M0 560 C250 510 430 620 710 562 C920 518 1080 536 1280 478 L1280 640 L0 640 Z" fill="#0b221a" opacity="0.7"/>

  <g transform="translate(72 72)">
    <rect width="64" height="64" rx="18" fill="#153c2f" stroke="#65d4ab" stroke-opacity="0.6"/>
    <path d="M32 13 49 20v13c0 11-6.8 18.5-17 21-10.2-2.5-17-10-17-21V20l17-7Z" fill="none" stroke="#75dbb5" stroke-width="3"/>
    <path d="M24 28h16v13H24zM27 25h10M32 28v13" fill="none" stroke="#dffbf0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
  </g>

  <text x="72" y="190" fill="#74d8b2" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">LOCAL-FIRST · WINDOWS</text>
  <text x="72" y="252" fill="#f5fbf8" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">Day-Trading</text>
  <text x="72" y="310" fill="#f5fbf8" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">Teacher</text>
  <text x="72" y="364" fill="#bdd0c8" font-family="Segoe UI, Arial, sans-serif" font-size="23">Practice better decisions—</text>
  <text x="72" y="397" fill="#bdd0c8" font-family="Segoe UI, Arial, sans-serif" font-size="23">not more trades.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">
    <rect x="72" y="442" width="126" height="42" rx="21" fill="#17382d" stroke="#39765f"/>
    <text x="96" y="469" fill="#dff8ee">Lessons</text>
    <path d="M213 463h28" stroke="#5cc99f" stroke-width="2"/>
    <path d="m234 456 8 7-8 7" fill="none" stroke="#5cc99f" stroke-width="2"/>
    <rect x="257" y="442" width="126" height="42" rx="21" fill="#17382d" stroke="#39765f"/>
    <text x="281" y="469" fill="#dff8ee">Replay</text>
    <path d="M398 463h28" stroke="#5cc99f" stroke-width="2"/>
    <path d="m419 456 8 7-8 7" fill="none" stroke="#5cc99f" stroke-width="2"/>
    <rect x="442" y="442" width="126" height="42" rx="21" fill="#17382d" stroke="#39765f"/>
    <text x="464" y="469" fill="#dff8ee">Journal</text>
  </g>

  <text x="72" y="545" fill="#7f9b90" font-family="Segoe UI, Arial, sans-serif" font-size="17">Education only · no signals · no order placement</text>
  <text x="72" y="580" fill="#648176" font-family="Segoe UI, Arial, sans-serif" font-size="15">React · TypeScript · Tauri · Rust</text>

  <g filter="url(#shadow)">
    <rect x="604" y="84" width="608" height="472" rx="30" fill="#13271f" stroke="#4da481" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="634" cy="108" r="6" fill="#fb7185"/>
    <circle cx="654" cy="108" r="6" fill="#fbbf24"/>
    <circle cx="674" cy="108" r="6" fill="#6ee7b7"/>
    <image href="day-trading-teacher-lessons.png" x="620" y="128" width="576" height="324" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)"/>
    <rect x="620" y="452" width="576" height="88" fill="#0c1d17"/>
    <text x="644" y="487" fill="#a9c5b9" font-family="Segoe UI, Arial, sans-serif" font-size="15">Lessons connect planning, replay,</text>
    <text x="644" y="512" fill="#a9c5b9" font-family="Segoe UI, Arial, sans-serif" font-size="15">journaling, and focused drills.</text>
  </g>
</svg>
