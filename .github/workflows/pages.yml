name: Project site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "scripts/check-documentation.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/images/**"
      - "scripts/check-documentation.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Project-site contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Verify documentation, media, and site claims
        run: node scripts/check-documentation.mjs

      - name: Stage and inspect the reviewed presentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/images
          cp site/index.html site/styles.css _site/
          cp docs/images/*.png _site/images/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/styles.css
          test "$(find _site/images -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 7

  deploy:
    name: Deploy reviewed site
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stage the reviewed presentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/images
          cp site/index.html site/styles.css _site/
          cp docs/images/*.png _site/images/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
