name: Project site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stage the reviewed presentation
        shell: bash
        run: |
          mkdir -p _site/images
          cp site/index.html site/styles.css _site/
          cp docs/images/*.png _site/images/

      - name: Detect whether GitHub Pages is enabled
        id: pages-status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/pages-status.json" \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Enable Settings > Pages > Build and deployment > GitHub Actions, then rerun this workflow. The reviewed site artifact was still staged successfully."
          else
            cat "$RUNNER_TEMP/pages-status.json"
            echo "Unexpected GitHub Pages API status: $status" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages-status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
