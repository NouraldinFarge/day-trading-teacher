name: Reproducible Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish portable release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: project/workspace

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: project/workspace/.node-version
          cache: npm
          cache-dependency-path: project/workspace/package-lock.json

      - name: Restore locked dependencies
        working-directory: project/workspace
        run: npm ci --ignore-scripts

      - name: Build and verify portable package
        working-directory: project/workspace
        env:
          DTT_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          DTT_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          DTT_REQUIRE_SIGNED_RELEASE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && '1' || '0' }}
        run: npm run portable:build

      - name: Prepare release assets and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archives = @(Get-ChildItem project/portable-builds -Filter 'day-trading-teacher-*-windows-x64-portable.zip')
          if ($archives.Count -ne 1) { throw "Expected exactly one Day-Trading Teacher archive; found $($archives.Count)." }
          $archive = $archives[0]
          Copy-Item -LiteralPath $archive.FullName -Destination release
          $copied = Join-Path (Resolve-Path release) $archive.Name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $copied).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -Encoding ascii -LiteralPath "$copied.sha256"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: project/workspace
          format: spdx-json
          output-file: release/day-trading-teacher-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false

      - name: Generate reviewed release notes
        working-directory: project/workspace
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          node scripts/generate-release-notes.mjs --version $version --output ../../release-notes.md

      - name: Attest portable package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --latest --notes-file release-notes.md --title "Day-Trading Teacher $env:GITHUB_REF_NAME"
